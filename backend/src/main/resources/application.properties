
spring.application.name=student-management

server.port=8080

# Supabase PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
# validate: Hibernate never creates or alters tables. Schema changes are applied
# deliberately from db/migrations. Override with JPA_DDL_AUTO only on purpose.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Enable explicitly for local SQL debugging.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Authentication (cookie-based JWT)
# JWT_SECRET: Base64 of at least 32 random bytes, e.g. `openssl rand -base64 64`.
# Required; startup fails without it. Never commit a real value.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.issuer=${JWT_ISSUER:student-management-system}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
# Secure cookies by default; set AUTH_COOKIE_SECURE=false only for local HTTP development.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.rate-limit.max-failures-per-email=5
app.auth.rate-limit.max-failures-per-client=20
app.auth.rate-limit.window=15m
# Trust the proxy-appended X-Forwarded-For entry. Only safe when the API is
# reachable solely through the Next.js proxy.
app.auth.rate-limit.trust-forwarded-for=${TRUST_PROXY_HEADERS:true}

# Browsers use the same-origin Next.js proxy, so no cross-origin access is
# allowed by default. Comma-separated exact origins, only if ever needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
