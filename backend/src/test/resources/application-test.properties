# Tests run against an in-memory H2 database (PostgreSQL mode), never Supabase.
spring.datasource.url=jdbc:h2:mem:sms-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only signing key (Base64 of 53 fixed bytes). Not used anywhere else.
app.auth.jwt-secret=dGVzdC1vbmx5LXNpZ25pbmcta2V5LWZvci1zdHVkZW50bXMtaW50ZWdyYXRpb24tdGVzdHM=
app.auth.cookie-secure=false
app.auth.rate-limit.trust-forwarded-for=false
